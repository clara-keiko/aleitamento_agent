<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Assistente de Aleitamento — protótipo</title>
<style>
  :root {
    --bg: #ece5dd;
    --panel: #ffffff;
    --header: #075e54;
    --header-text: #ffffff;
    --bubble-in: #ffffff;
    --bubble-out: #dcf8c6;
    --text: #111b21;
    --muted: #667781;
    --border: rgba(0, 0, 0, .08);
    --alert: #b3261e;
    --chip: #f0f2f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b141a;
      --panel: #111b21;
      --header: #1f2c33;
      --bubble-in: #202c33;
      --bubble-out: #005c4b;
      --text: #e9edef;
      --muted: #8696a0;
      --border: rgba(255, 255, 255, .1);
      --alert: #f2b8b5;
      --chip: #202c33;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 560px;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    box-shadow: 0 0 40px rgba(0,0,0,.12);
  }

  header {
    background: var(--header);
    color: var(--header-text);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,.2);
    display: grid; place-items: center; font-size: 20px;
    flex-shrink: 0;
  }
  .title { font-weight: 600; }
  .subtitle { font-size: 12px; opacity: .8; }
  .toggle {
    margin-left: auto;
    background: rgba(255,255,255,.15);
    border: 0; color: inherit; font: inherit; font-size: 12px;
    padding: 6px 10px; border-radius: 999px; cursor: pointer;
  }
  .toggle[aria-pressed="true"] { background: rgba(255,255,255,.35); }

  .banner {
    background: var(--chip);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    font-size: 12px;
    color: var(--muted);
    flex-shrink: 0;
  }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--bg);
  }
  .row { display: flex; flex-direction: column; max-width: 85%; }
  .row.out { align-self: flex-end; align-items: flex-end; }
  .row.in { align-self: flex-start; }
  .bubble {
    padding: 8px 12px;
    border-radius: 12px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    box-shadow: 0 1px 1px rgba(0,0,0,.06);
  }
  .in .bubble { background: var(--bubble-in); border-top-left-radius: 4px; }
  .out .bubble { background: var(--bubble-out); border-top-right-radius: 4px; }
  .bubble strong { font-weight: 600; }

  .meta {
    font-size: 11px;
    color: var(--muted);
    margin-top: 3px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .meta[hidden] { display: none; }
  .meta .tag {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 999px;
    background: var(--chip);
    border: 1px solid var(--border);
  }
  .tag.emergencia, .tag.encaminhamento { color: var(--alert); font-weight: 600; }

  .typing { display: flex; gap: 4px; padding: 12px; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%; background: var(--muted);
    animation: blink 1.3s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .25 } 30% { opacity: 1 } }

  .suggestions {
    display: flex; gap: 6px; padding: 8px 16px 0;
    overflow-x: auto; flex-shrink: 0; background: var(--bg);
  }
  .suggestions button {
    white-space: nowrap; font: inherit; font-size: 12px;
    padding: 6px 12px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--panel);
    color: var(--text); cursor: pointer;
  }

  form {
    display: flex; gap: 8px; padding: 12px 16px;
    background: var(--bg); flex-shrink: 0;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
  }
  input[type=text] {
    flex: 1; font: inherit; padding: 11px 16px;
    border-radius: 999px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text);
  }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--header); outline-offset: 1px; }
  form button {
    width: 44px; height: 44px; border-radius: 50%; border: 0;
    background: var(--header); color: #fff; font-size: 18px; cursor: pointer;
  }
  form button:disabled { opacity: .5; cursor: default; }

  dialog {
    border: 0; border-radius: 14px; padding: 24px;
    background: var(--panel); color: var(--text); max-width: 320px;
  }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  dialog input { width: 100%; margin: 12px 0; padding: 10px;
    border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font: inherit; }
  dialog button { width: 100%; padding: 10px; border: 0; border-radius: 8px;
    background: var(--header); color: #fff; font: inherit; cursor: pointer; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar">🤱</div>
    <div>
      <div class="title">Assistente de Aleitamento</div>
      <div class="subtitle" id="status">protótipo · não é atendimento médico</div>
    </div>
    <button class="toggle" id="inspect" aria-pressed="false" title="Mostra qual camada respondeu">
      inspeção
    </button>
  </header>

  <div class="banner">
    Pré-visualização do agente que vai para o WhatsApp — mesma triagem, mesma base,
    mesmas respostas. Em emergência, ligue <strong>192</strong>.
  </div>

  <div id="log" role="log" aria-live="polite"></div>

  <div class="suggestions" id="suggestions"></div>

  <form id="form">
    <input type="text" id="input" placeholder="Escreva sua dúvida…"
           autocomplete="off" enterkeyhint="send" required>
    <button type="submit" id="send" aria-label="Enviar">➤</button>
  </form>
</div>

<dialog id="gate">
  <strong>Código de acesso</strong>
  <input type="password" id="code" placeholder="código" autocomplete="off">
  <button id="unlock">Entrar</button>
</dialog>

<script>
const log = document.getElementById('log');
const form = document.getElementById('form');
const input = document.getElementById('input');
const send = document.getElementById('send');
const inspect = document.getElementById('inspect');
const gate = document.getElementById('gate');

// Sessão é só um identificador local de conversa. Não coletamos telefone,
// nome nem qualquer dado que identifique a pessoa.
let session = localStorage.getItem('session');
if (!session) {
  session = 'web-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
  localStorage.setItem('session', session);
}

let accessCode = localStorage.getItem('accessCode') || '';
let inspecting = localStorage.getItem('inspecting') === '1';
inspect.setAttribute('aria-pressed', String(inspecting));

const SUGESTOES = [
  'Como sei se a pega está correta?',
  'Preciso dar mamada de 3 em 3 horas?',
  'Como aumentar a produção de leite?',
  'Posso amamentar com febre?',
  'Como doar leite humano?',
];

const sugestoes = document.getElementById('suggestions');
SUGESTOES.forEach(texto => {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = texto;
  b.onclick = () => { input.value = texto; form.requestSubmit(); };
  sugestoes.append(b);
});

function bolha(texto, lado, desfecho) {
  const row = document.createElement('div');
  row.className = 'row ' + lado;

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  // *negrito* do WhatsApp. Montamos por nó de texto — nada de innerHTML com
  // conteúdo vindo do servidor.
  texto.split(/(\*[^*\n]+\*)/g).forEach(parte => {
    if (parte.startsWith('*') && parte.endsWith('*') && parte.length > 2) {
      const forte = document.createElement('strong');
      forte.textContent = parte.slice(1, -1);
      bubble.append(forte);
    } else if (parte) {
      bubble.append(document.createTextNode(parte));
    }
  });
  row.append(bubble);

  if (desfecho) {
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.hidden = !inspecting;
    const tag = document.createElement('span');
    tag.className = 'tag ' + desfecho;
    tag.textContent = desfecho;
    meta.append(tag);
    row.append(meta);
  }

  log.append(row);
  log.scrollTop = log.scrollHeight;
  return row;
}

inspect.onclick = () => {
  inspecting = !inspecting;
  localStorage.setItem('inspecting', inspecting ? '1' : '0');
  inspect.setAttribute('aria-pressed', String(inspecting));
  document.querySelectorAll('.meta').forEach(m => { m.hidden = !inspecting; });
};

function digitando() {
  const row = document.createElement('div');
  row.className = 'row in';
  row.innerHTML = '<div class="bubble typing"><span></span><span></span><span></span></div>';
  log.append(row);
  log.scrollTop = log.scrollHeight;
  return row;
}

document.getElementById('unlock').onclick = (e) => {
  e.preventDefault();
  accessCode = document.getElementById('code').value.trim();
  localStorage.setItem('accessCode', accessCode);
  gate.close();
  input.focus();
};

form.onsubmit = async (e) => {
  e.preventDefault();
  const texto = input.value.trim();
  if (!texto) return;

  bolha(texto, 'out');
  input.value = '';
  send.disabled = true;
  const indicador = digitando();

  try {
    const resposta = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Access-Code': accessCode },
      body: JSON.stringify({ session, text: texto }),
    });

    indicador.remove();

    if (resposta.status === 401) {
      gate.showModal();
      return;
    }
    if (!resposta.ok) {
      bolha('Erro ' + resposta.status + '. Verifique o log do servidor.', 'in');
      return;
    }

    const dados = await resposta.json();
    (dados.replies || []).forEach((r, i) => {
      // O desfecho vale para a resposta como um todo; marcamos só a última
      // bolha para não repetir a etiqueta em mensagem quebrada.
      const ultima = i === dados.replies.length - 1;
      bolha(r, 'in', ultima ? dados.outcome : null);
    });
  } catch (erro) {
    indicador.remove();
    bolha('Não consegui falar com o servidor.', 'in');
  } finally {
    send.disabled = false;
    input.focus();
  }
};

input.focus();
</script>
</body>
</html>
