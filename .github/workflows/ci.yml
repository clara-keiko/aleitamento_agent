name: CI

# Só main e pull requests. Antes rodava em `push` para qualquer branch **e**
# em `pull_request`, o que dobrava a execução em todo commit de PR.
on:
  push:
    branches: [main]
  pull_request:

# Um push novo cancela a execução anterior do mesmo PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Testes
        run: python -m pytest

      # Avaliação da triagem clínica. Não chama a OpenAI, não custa nada, e
      # falha o build se um caso de emergência deixar de ser reconhecido.
      - name: Avaliação de segurança (conjunto dourado)
        run: python evals/run_eval.py
