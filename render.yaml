services:
  - type: web
    name: aleitamento-agent
    runtime: python
    # O plano free hiberna após 15 min: o primeiro webhook depois da pausa
    # espera ~1 min de cold start e a Meta reentrega o evento nesse meio-tempo.
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    # Migrações do banco antes do código novo subir. Se falhar, o deploy para
    # e a versão anterior continua no ar. Ver migrations/0001_memoria.sql.
    preDeployCommand: python -m app.migrar
    # Convites, testadoras e contadores de uso da fase de testes. Sem disco,
    # cada deploy zeraria tudo e as 30 pessoas perderiam o acesso.
    disk:
      name: lactai-dados
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # meta (oficial), evolution (QR, não oficial) ou twilio. O LactAI rodou
      # pela Evolution enquanto a Meta não soltava a linha de crédito da
      # Twilio; desde 11/2026 é o número oficial. A Evolution saiu deste
      # arquivo depois que o WhatsApp restringiu o número não oficial — para
      # voltar a ela, ver docs/EVOLUTION.md.
      - key: WHATSAPP_PROVIDER
        value: meta

      # A Twilio assina a URL pública. Atrás do proxy do Render, request.url
      # chega como http:// interno e a assinatura nunca bate. Sem isto, todo
      # webhook vira 403 — e o log só diz "assinatura inválida".
      # Preencha com https://SEU-APP.onrender.com depois do primeiro deploy.
      - key: PUBLIC_BASE_URL
        sync: false

      # ── Twilio ──────────────────────────────────────────────────────
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      # Sandbox: whatsapp:+14155238886
      - key: TWILIO_WHATSAPP_FROM
        sync: false

      # ── Meta ────────────────────────────────────────────────────────
      # Texto qualquer; o mesmo vai no campo "Verificar token" do webhook
      # no app da Meta.
      - key: VERIFY_TOKEN
        sync: false
      # Token permanente do usuário do sistema (Configurações do negócio →
      # Usuários do sistema → Gerar token, validade "Nunca").
      - key: WHATSAPP_TOKEN
        sync: false
      # +55 21 92368-1754 (LactAI). Não é segredo.
      - key: PHONE_NUMBER_ID
        value: "1303115646210874"
      # App da Meta → Configurações → Básico → Chave secreta do app.
      - key: APP_SECRET
        sync: false

      - key: OPENAI_API_KEY
        sync: false
      - key: VECTOR_STORE_ID
        sync: false
      - key: PSEUDONYM_KEY
        generateValue: true
      - key: OPENAI_MODEL
        value: gpt-5-mini
      # gpt-5-mini raciocina antes de responder; esforço baixo mantém a
      # latência aceitável no WhatsApp.
      - key: REASONING_EFFORT
        value: low
      # 0 = o código escolhe o teto conforme o modelo. Ver .env.example.
      - key: MAX_OUTPUT_TOKENS
        value: "0"
      - key: OPENAI_TIMEOUT_SECONDS
        value: "45"
      - key: MAX_RETRIEVAL_RESULTS
        value: "8"
      - key: ENABLE_WEB
        value: "true"
      # Defina no painel antes de compartilhar o link do protótipo.
      - key: WEB_ACCESS_CODE
        sync: false
      - key: ENABLE_AUDIO
        value: "true"
      - key: REQUIRE_SIGNATURE
        value: "true"
      # Números sempre liberados, além dos convidados (ex.: o seu, para
      # testar). Separados por vírgula.
      - key: ALLOWED_SENDERS
        sync: false

      # ── Fase de testes (ver docs/PILOTO.md) ─────────────────────────
      # convite = só conversa quem entrou pelo link; aberto = todo mundo.
      - key: MODO_ACESSO
        value: convite
      # CODIGO:VAGAS. O código vai dentro do link de convite; quando as
      # vagas acabam, o link para de aceitar gente nova sozinho. Para abrir
      # mais vagas, aumente o número — quem já entrou continua.
      - key: CONVITES
        value: PILOTO30:40
      # Perguntas por pessoa por dia (só as que chamam o modelo).
      - key: LIMITE_DIARIO_POR_PESSOA
        value: "20"
      # Teto do mês em dólares com a OpenAI. Atingiu, o agente para de
      # chamar o modelo até o mês virar (emergência continua respondida).
      - key: ORCAMENTO_MENSAL_USD
        value: "15"
      - key: DB_PATH
        value: /var/data/lactai.db
      # Número do LactAI, para montar o link de convite no painel.
      - key: NUMERO_WHATSAPP
        value: "5521923681754"
      # Senha do painel /admin/piloto. Veja em Environment, no Render.
      - key: ADMIN_TOKEN
        generateValue: true

      # ── Memória persistente (ver docs/MEMORIA_E_LEMBRETES.md) ──────
      - key: DATABASE_URL
        fromDatabase:
          name: lactai-db
          property: connectionString
      # Chave da cifra das conversas. ⚠️ NUNCA apague nem troque: sem ela,
      # tudo o que foi guardado fica ilegível. Guarde uma cópia num cofre
      # de senhas.
      - key: CHAVE_DADOS
        generateValue: true
      # Ligada em 27/11/2026, com a política de privacidade nova publicada.
      # "false" volta à memória curta sem apagar o que já foi guardado.
      - key: MEMORIA_ATIVA
        value: "true"
      # Lembrete de vacina no mesversário. Só "true" depois de a Meta aprovar
      # o modelo lembrete_vacina_mesversario (ver docs/LEMBRETES.md).
      - key: LEMBRETES_ATIVOS
        value: "false"
      # Planos: gratuito 10/mês (5/dia), LactAI Plus 150/mês (30/dia). Só
      # "true" quando o piloto acabar; até lá vale o limite diário do piloto.
      - key: PLANOS_ATIVOS
        value: "false"

databases:
  # Memória do cuidador(a) e diário do bebê. Plano pago: backup diário.
  - name: lactai-db
    plan: basic-256mb
    region: oregon
    databaseName: lactai
    user: lactai
