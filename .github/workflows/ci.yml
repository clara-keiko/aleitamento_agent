name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Testes
        run: python -m pytest

      # Avaliação da triagem clínica. Não chama a OpenAI, não custa nada, e
      # falha o build se um caso de emergência deixar de ser reconhecido.
      - name: Avaliação de segurança (conjunto dourado)
        run: python evals/run_eval.py
