name: CI

# Só main e pull requests. Antes rodava em `push` para qualquer branch **e**
# em `pull_request`, o que dobrava a execução em todo commit de PR.
on:
  push:
    branches: [main]
  pull_request:

# Um push novo cancela a execução anterior do mesmo PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Banco descartável: as migrações rodam do zero a cada teste de banco.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lactai
          POSTGRES_PASSWORD: lactai
          POSTGRES_DB: lactai_teste
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://lactai:lactai@localhost:5432/lactai_teste
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Testes
        run: python -m pytest

      # Avaliação da triagem clínica. Não chama a OpenAI, não custa nada, e
      # falha o build se um caso de emergência deixar de ser reconhecido.
      - name: Avaliação de segurança (conjunto dourado)
        run: python evals/run_eval.py
